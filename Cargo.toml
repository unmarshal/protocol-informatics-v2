[package]
name = "protocol-informatics-v2"
version = "0.1.0"
edition = "2024"
description = "Evidence-oriented protocol and data format inference"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
libc = "0.2.191"
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process"] }
